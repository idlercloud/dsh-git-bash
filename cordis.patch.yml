# @idlercloud/dsh-git-bash bundle patch.
#
# 把两行绑进同一个 "shell" 隔离 realm —— 不需要容器行：
# 使用 isolate: { shell: dsh-git-bash } 映射，只隔离 shell 服务。
# 两行的 shell 使用相同标签，因此共享同一个 shell 服务隔离 realm：
#   · git-bash-executor 提供该 realm 内的 ctx.shell（Git Bash 执行器）；
#   · git-bash-tool      消费该服务，注册出标准的 bash 工具。
# 宿主的 pwsh 执行器与 tool-pwsh 完全不受影响——只隔离了 shell 这一个名字。
#
# 想换 Git Bash 路径：在 config 里写 bashPath，或设置环境变量 DSH_GIT_BASH。
- insert:
    - id: git-bash-executor
      name: '@idlercloud/dsh-git-bash'
      isolate:
        shell: dsh-git-bash

    - id: git-bash-tool
      name: '@deepseek-ai/dsh-tool-bash'
      isolate:
        shell: dsh-git-bash
